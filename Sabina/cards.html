<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="styling.css" />
</head>

<body>
    <!--card 1-->
    <div class="card">
        <img class="Avatar" src="./pictures/Large avatar profile.png" alt="AvatarProfile" width="160.01" height="160">
        <div class="badge">
            <div class="title">Hello, PlayerOne!</div>
            <div class="text">Ready for your next adventure? Your friends are currently exploring
                Brookhaven and Blox Fruits. Jump back in!</div>
            <div class="bottons">
                <div class="btn1">
                    <img src="./pictures/Icon (4).svg" alt="Logo" width="24" height="12">
                    <div>12 Friends Online</div>
                </div>
                <div class="btn2">
                    <img src="./pictures/Icon (5).svg" alt="Logo" width="20" height="20">
                    <div>Level 42 Architect</div>
                </div>
            </div>
        </div>
    </div>
    <div class="div2">
        <!--card 2-->
        <div class="card2">
            <div class="div">
                <img class="picture"
                    src="./pictures/BigImage(1).png"
                    alt="BackroundPicture" width="236" height="144">
                <div class="box">
                    <img class="image" src="./pictures/Background.svg" alt="BackroundImage" width="8" height="8">
                    <div class="text1">24.5K Playing</div>
                </div>
            </div>
            <div class="box2">
                <div class="text2">Blox Fruits</div>
                <div class="percents"><img class="image" src="./pictures/Icon.png" alt="Icon" width="12.25" height="11.67">96%</div>
            </div>
        </div>
        <!--card 3-->
        <div class="card3">
            <div class="container">
                <div class="div1">
                    <img class="picture2"
                        src="./pictures/BigImage(2).png"
                        alt="BackroundPicture" width="286" height="286">
                </div>

                <div class="title1">City Life 2</div>
                <div class="Iconic">
                    <div class="percents2"><img class="Icon2" src="./pictures/Icon.png" alt="Icon" width="12.25" height="11.67">98%</div>
                    <div class="text3">4.2K Active</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
